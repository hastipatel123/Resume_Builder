<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JobSmart</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-page">

    <div class="auth-card">

        <div class="card-top">
            <div class="card-logo">
                <img src="images/JobSMart.png" alt="JobSmart">
            </div>
            <h1>Create Account</h1>
            <p class="card-subtitle">Join JobSmart to find your perfect job</p>
        </div>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label>Register As</label>
                <div class="role-options">
                    <label><input type="radio" name="role" value="candidate" checked> Candidate</label>
                    <label><input type="radio" name="role" value="recruiter"> Recruiter</label>
                    <label><input type="radio" name="role" value="admin"> Admin</label>
                </div>
            </div>

            <button type="submit" class="submit-btn">Create Account</button>

        </form>

        <p id="message"></p>

        <p class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </p>

    </div>

    <script src="js/register.js"></script>
</body>
</html>
